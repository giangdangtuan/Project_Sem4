<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paginated Contact List with Modal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        .pagination-container {
            position: fixed;
            bottom: 0;
            width: 100%;
            background-color: #f8f9fa;
            padding: 10px 0;
        }
        .page-link {
            border-radius: 0;
        }
        .page-item.disabled .page-link {
            background-color: #d3d3d3;
            color: #6c757d;
            pointer-events: none;
        }
        .contact-card {
            margin-bottom: 15px; /* Add space between comments */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Contact List</h1>

        <div id="contact-container">
            <div th:each="contact : ${ListContact}" class="contact-card" data-email="${contact.email}" data-message="${contact.message}">
                <div class="card p-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="user d-flex flex-row align-items-start" style="gap: 10px;">
                            <img th:src="@{/image/user.png}" width="30" class="user-img rounded-circle" alt="User Image">
                            <div>
                                <span>
                                    <small class="font-weight-bold text-primary" th:text="${contact.email}"></small>
                                </span>
                                <br>
                                <span>
                                    <small class="font-weight-bold" th:text="${contact.message}"></small>
                                </span>
                            </div>
                        </div>
                        <small>2 days ago</small>
                    </div>
                    <div class="action d-flex justify-content-between mt-2 align-items-center">
                        <div class="reply px-4"></div>
                        <div class="icons align-items-center">
                            <i class="fa fa-star text-warning"></i>
                            <i class="fa fa-check-circle-o check-icon"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="pagination-container">
        <nav aria-label="Page navigation">
            <ul class="pagination justify-content-center">
                <li class="page-item"><a class="page-link" href="#" id="prevPage">Previous</a></li>
                <li class="page-item"><a class="page-link" href="#" id="nextPage">Next</a></li>
            </ul>
        </nav>
    </div>

    <!-- Modal -->
    <!-- Modal -->
<div class="modal fade" id="contactModal" tabindex="-1" aria-labelledby="contactModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="contactModalLabel">Contact Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p><strong>Email:</strong> <span id="modalEmail"></span></p>
                <p><strong>Comment:</strong> <span id="modalComment"></span></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>


    <!-- jQuery CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
       $(document).ready(function() {
    var itemsPerPage = 6; // Adjust this to set items per page
    var $items = $('#contact-container .contact-card');
    var numItems = $items.length;
    var numPages = Math.ceil(numItems / itemsPerPage);

    function showPage(page) {
        $items.hide();
        $items.slice((page - 1) * itemsPerPage, page * itemsPerPage).show();
        updatePagination(page);
    }

    function setupPagination() {
        $('#prevPage').click(function(e) {
            e.preventDefault();
            var currentPage = getCurrentPage();
            if (currentPage > 1) {
                showPage(currentPage - 1);
                setCurrentPage(currentPage - 1);
            }
        });

        $('#nextPage').click(function(e) {
            e.preventDefault();
            var currentPage = getCurrentPage();
            if (currentPage < numPages) {
                showPage(currentPage + 1);
                setCurrentPage(currentPage + 1);
            }
        });
    }

    function getCurrentPage() {
        return parseInt($('.pagination').attr('data-current-page'), 10);
    }

    function setCurrentPage(page) {
        $('.pagination').attr('data-current-page', page);
    }

    function updatePagination(page) {
        $('#prevPage').parent().toggleClass('disabled', page === 1);
        $('#nextPage').parent().toggleClass('disabled', page === numPages);
    }

    // Initialize pagination
    setCurrentPage(1);
    showPage(1);
    setupPagination();

    // Setup modal to show contact details
    $items.click(function() {
        var email = $(this).data('email');
        var message = $(this).data('message');
        $('#modalEmail').text(email);  // Set email in modal
        $('#modalComment').text(message);  // Set message in modal
        $('#contactModal').modal('show');  // Show modal
    });
});

    </script>
</body>
</html>
