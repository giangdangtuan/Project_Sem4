<script>
    $(document).ready(function () {
        var itemsPerPage = 6;
        var $items = $('#event-container .event-item');
        var numItems = $items.length;
        var numPages = Math.ceil(numItems / itemsPerPage);

        function showPage(page) {
            $items.hide();
            $items.slice((page - 1) * itemsPerPage, page * itemsPerPage).show();
        }

        function setupPagination() {
            $('#prevPage').click(function (e) {
                e.preventDefault();
                var currentPage = getCurrentPage();
                if (currentPage > 1) {
                    showPage(currentPage - 1);
                    setCurrentPage(currentPage - 1);
                }
            });

            $('#nextPage').click(function (e) {
                e.preventDefault();
                var currentPage = getCurrentPage();
                if (currentPage < numPages) {
                    showPage(currentPage + 1);
                    setCurrentPage(currentPage + 1);
                }
            });
        }

        function getCurrentPage() {
            return parseInt($('.pagination').attr('data-current-page'), 10);
        }

        function setCurrentPage(page) {
            $('.pagination').attr('data-current-page', page);
        }

        // Initialize pagination
        setCurrentPage(1);
        showPage(1);
        setupPagination();
    });

</script>

<script>
    document.getElementById('searchInput').addEventListener('keyup', function () {
        var filter = this.value.toLowerCase();
        var eventItems = document.querySelectorAll('.event-item');

        eventItems.forEach(function (item) {
            var title = item.querySelector('.title').innerText.toLowerCase();
            if (title.includes(filter)) {
                item.style.display = '';
            } else {
                item.style.display = 'none';
            }
        });
    });
</script>
<script>
    // Lấy tất cả các liên kết trong nav
    const links = document.querySelectorAll('.event-nav a');
    const currentUrl = window.location.href;

    links.forEach(link => {
        // Kiểm tra nếu href của liên kết trùng với URL hiện tại
        if (currentUrl.includes(link.href)) {
            // Xóa class 'active' khỏi các liên kết khác
            links.forEach(l => l.classList.remove('active'));
            // Thêm class 'active' cho liên kết khớp
            link.classList.add('active');
        }
    });

    $(document).ready(function () {
        $(".tb-select li a").click(function () {
            // Xóa lớp 'active' khỏi tất cả các 'li' và 'tb-item'
            $(".tb-select li").removeClass("active");
            $(".tb-item").each(function () {
                $(this).css("display", "none");
            });

            // Thêm lớp 'active' vào 'li' được chọn và hiển thị phần tử tương ứng
            $(this).closest("li").addClass("active");

            // Dùng một điều kiện để chọn phần tử div tương ứng và hiển thị nó
            if ($(this).closest("li").index() === 0) { // Hot Sale
                $("#hot-sale-concert").css("display", "block");
            } else if ($(this).closest("li").index() === 1) { // On Sale
                $("#coming-soon-concert").css("display", "block");
            }
        });
    });
</script>
